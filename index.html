<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCATCrusher - CARS Practice</title>
<style>
:root {
  --header-blue:   #1851A9;
  --header-blue-2: #1A5BB8;
  --subbar-bg:     #C8D4E5;
  --subbar-border: #8FA3C0;
  --button-bg:     #E8EAED;
  --button-border: #9CA3AF;
  --highlight:     #FFFF00;
  --info-blue:     #1565C0;
  --correct-green: #2E7D32;
  --incorrect-red: #C62828;
  --text:          #1A1A1A;
  --text-muted:    #5F6B7A;
  --border:        #B0BEC5;
  --pane-divider:  #94A3B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Arial, Helvetica, "Liberation Sans", sans-serif;
  color: var(--text);
  background: #FFFFFF;
  font-size: 14px;
  line-height: 1.45;
}
.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ================ Setup screen ================ */
.setup {
  flex: 1;
  padding: 26px;
  background:
    radial-gradient(circle at top left, rgba(24, 81, 169, 0.18), transparent 30%),
    radial-gradient(circle at bottom right, rgba(46, 125, 50, 0.12), transparent 28%),
    linear-gradient(180deg, #EEF3FB 0%, #FFFFFF 70%);
}
.landing-shell {
  max-width: 1120px;
  margin: 0 auto;
  min-height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.settings-bar {
  background: rgba(255,255,255,0.92);
  border: 1px solid rgba(176, 190, 197, 0.85);
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 16px 42px rgba(24, 81, 169, 0.12);
  backdrop-filter: blur(10px);
}
.settings-bar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.settings-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--header-blue);
  font-weight: 800;
  letter-spacing: -0.01em;
}
.site-footer {
  text-align: center;
  color: #7A8797;
  font-size: 11.5px;
  padding: 4px 0 2px;
}
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1.8fr;
  gap: 12px;
  align-items: end;
}
.landing-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
  gap: 24px;
  align-items: center;
}
.hero-copy {
  padding: 20px 6px;
}
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--header-blue);
  background: #E7EEF8;
  border: 1px solid #CFDDF0;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 16px;
}
.hero-title {
  font-size: clamp(38px, 6vw, 68px);
  line-height: 0.95;
  letter-spacing: -0.055em;
  color: #132238;
  margin-bottom: 18px;
}
.hero-title span { color: var(--header-blue); }
.hero-subtitle {
  max-width: 640px;
  color: #46576D;
  font-size: 17px;
  line-height: 1.65;
  margin-bottom: 24px;
}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  max-width: 650px;
}
.stat-card {
  background: rgba(255,255,255,0.86);
  border: 1px solid #DCE5F1;
  border-radius: 16px;
  padding: 15px;
  box-shadow: 0 10px 30px rgba(24, 81, 169, 0.08);
}
.stat-card strong {
  display: block;
  color: var(--header-blue);
  font-size: 24px;
  line-height: 1.1;
  margin-bottom: 4px;
}
.stat-card span {
  color: var(--text-muted);
  font-size: 12.5px;
  line-height: 1.35;
}
.setup-card {
  width: 100%;
  background: rgba(255,255,255,0.96);
  border: 1px solid #D6E0EC;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(24, 81, 169, 0.16);
}
.setup-brand {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
  color: var(--header-blue);
}
.setup-brand .crusher { color: var(--text); }
.setup .subtitle { color: var(--text-muted); margin-bottom: 22px; font-size: 13px; }
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}
.field input, .field select {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid #C4D0DE;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  background: white;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--header-blue);
  box-shadow: 0 0 0 4px rgba(24, 81, 169, 0.13);
}
.field .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; line-height: 1.4; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.start-card-title {
  font-size: 18px;
  font-weight: 800;
  color: #132238;
  margin-bottom: 6px;
}
.start-card-copy {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 18px;
}
.primary-btn {
  background: var(--header-blue);
  color: white;
  border: 1px solid var(--header-blue-2);
  padding: 11px 22px;
  border-radius: 10px;
  font-family: inherit;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
}
.primary-btn:hover { background: #15489A; transform: translateY(-1px); box-shadow: 0 10px 24px rgba(24, 81, 169, 0.18); }
.primary-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
.secondary-btn {
  background: #FFFFFF;
  color: var(--header-blue);
  border: 1px solid #B9CBE2;
  padding: 11px 22px;
  border-radius: 10px;
  font-family: inherit;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
}
.secondary-btn:hover { background: #F3F7FC; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(24, 81, 169, 0.10); }
.err {
  color: var(--incorrect-red);
  font-size: 13px;
  margin-top: 10px;
  padding: 9px 11px;
  background: #FDECEC;
  border: 1px solid #F5C2C2;
  border-radius: 10px;
  line-height: 1.4;
}

/* ================ Top header bar ================ */
.topbar {
  background: linear-gradient(180deg, var(--header-blue-2) 0%, var(--header-blue) 100%);
  color: white;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 700;
  border-bottom: 1px solid #0D3B82;
  flex-shrink: 0;
}
.topbar .progress { font-size: 13px; font-weight: 400; }
.topbar .progress::before { content: "▦  "; opacity: 0.85; }

/* ================ Sub-toolbar (highlight, pause, solution) ================ */
.subbar {
  background: var(--subbar-bg);
  border-bottom: 1px solid var(--subbar-border);
  padding: 5px 14px;
  display: flex;
  align-items: center;
  font-size: 13px;
  gap: 18px;
  flex-shrink: 0;
}
.subbar-left { display: flex; align-items: center; gap: 16px; flex: 1; }
.subbar-center { display: flex; align-items: center; gap: 6px; }
.subbar-right { flex: 1; }
.tool {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  user-select: none;
  padding: 2px 4px;
  border-radius: 2px;
}
.tool:hover { background: rgba(255,255,255,0.4); }
.tool.active { background: rgba(255,255,255,0.6); }
.tool .swatch {
  display: inline-block;
  width: 13px;
  height: 13px;
  background: var(--highlight);
  border: 1px solid #999;
}
.tool .strike-icon::before { content: "✎"; font-size: 14px; }
.tool .label { text-decoration: underline; }
.subbar-btn {
  background: var(--button-bg);
  border: 1px solid var(--button-border);
  padding: 3px 16px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  border-radius: 2px;
  color: var(--text);
}
.subbar-btn:hover { background: #DDE0E4; }
.subbar-btn:active { background: #C8CDD3; }

/* ================ Practice main area ================ */
.practice {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  min-height: 0;
  border-bottom: 1px solid var(--border);
}
.pane {
  overflow-y: auto;
  padding: 14px 18px;
  background: white;
  position: relative;
}
.passage-pane { border-right: 1px solid var(--pane-divider); }
.passage-pane .passage-header {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 10px;
}
.passage-text {
  font-size: 14px;
  line-height: 1.55;
  text-align: justify;
}
.passage-text p { margin-bottom: 10px; text-indent: 1.4em; }
.passage-text p:first-child { text-indent: 1.4em; }
.passage-text mark.user-highlight {
  background: var(--highlight);
  padding: 0;
}
.passage-text s.user-strike {
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.passage-footer {
  margin-top: 14px;
  font-size: 11.5px;
  color: var(--text-muted);
  font-style: italic;
}

/* Question pane */
.question-pane .question-header {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 8px;
}
.solution-indicator {
  display: none;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--text-muted);
}
.solution-indicator.show { display: flex; }
.solution-indicator .mark-icon {
  width: 18px; height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  border-radius: 2px;
}
.solution-indicator .mark-icon.correct { color: var(--correct-green); }
.solution-indicator .mark-icon.incorrect { color: var(--incorrect-red); }
.q-stem { font-size: 14px; margin-bottom: 14px; line-height: 1.5; }
.q-meta { margin: 14px 0 18px; font-size: 13px; color: var(--info-blue); line-height: 1.45; }
.q-meta .meta-label { font-weight: 700; }
.q-meta .meta-block { margin-bottom: 8px; }
.choices { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 8px;
  cursor: pointer;
  border-radius: 2px;
  font-size: 14px;
  line-height: 1.5;
}
.choice:hover { background: #F2F5FA; }
.choice input[type="radio"] {
  margin-top: 4px;
  cursor: pointer;
  flex-shrink: 0;
}
.choice .choice-text strong { margin-right: 4px; }
.choice.correct-shown .choice-text { background: var(--highlight); padding: 1px 3px; }
.choice.correct-shown .choice-text strong { font-weight: 700; }
.explanation {
  margin-top: 6px;
  padding: 10px 14px 10px 28px;
  font-size: 13px;
  color: var(--info-blue);
  line-height: 1.55;
}

/* ================ Bottom nav bar ================ */
.bottombar {
  background: linear-gradient(180deg, var(--header-blue-2) 0%, var(--header-blue) 100%);
  color: white;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  border-top: 1px solid #0D3B82;
  flex-shrink: 0;
}
.bottombar-left, .bottombar-right { display: flex; align-items: center; gap: 22px; }
.nav-link {
  color: white;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 3px;
}
.nav-link u { text-decoration: underline; text-underline-offset: 2px; }
.nav-link:hover { background: rgba(255,255,255,0.12); }
.nav-link:disabled { opacity: 0.5; cursor: not-allowed; }
.nav-link:disabled:hover { background: transparent; }

/* ================ Loading ================ */
.loading {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: white;
}
.spinner {
  width: 38px; height: 38px;
  border: 3px solid #DCE3EE;
  border-top-color: var(--header-blue);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-muted); font-size: 13px; }

/* ================ Review (Score Report) ================ */
.review {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  background: #F5F7FA;
}
.review-card {
  max-width: 760px;
  margin: 0 auto;
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 28px;
}
.score-banner {
  background: linear-gradient(135deg, #E7EEF8, #F4F8FD);
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 22px;
  text-align: center;
}
.score-banner .pct { font-size: 38px; font-weight: 700; color: var(--header-blue); letter-spacing: -0.02em; }
.score-banner .label { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.review-q {
  border-top: 1px solid #E0E5EB;
  padding-top: 16px;
  margin-top: 16px;
}
.review-q-stem { font-weight: 700; margin-bottom: 6px; line-height: 1.4; font-size: 14px; }
.review-q-meta { font-size: 12px; color: var(--info-blue); margin-bottom: 8px; }
.review-q-answer { margin-bottom: 6px; font-size: 13px; }
.review-q-explain { font-size: 13px; color: #4B5563; line-height: 1.5; margin-top: 6px; }
.review-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
}

/* ================ Notes modal ================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: white;
  border-radius: 4px;
  padding: 22px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}
.modal h3 { font-size: 16px; margin-bottom: 12px; }
.modal textarea {
  width: 100%;
  height: 180px;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px;
  font-family: inherit;
  font-size: 13px;
  resize: vertical;
}
.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}
.modal-buttons button {
  background: var(--button-bg);
  border: 1px solid var(--button-border);
  padding: 6px 16px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  border-radius: 2px;
}

@media (max-width: 900px) {
  .practice { grid-template-columns: 1fr; }
  .passage-pane { border-right: none; border-bottom: 1px solid var(--pane-divider); max-height: 50vh; }
  .field-row, .settings-grid, .landing-hero, .hero-stats, .review-actions { grid-template-columns: 1fr; }
  .setup { padding: 16px; }
  .settings-bar-header { align-items: flex-start; flex-direction: column; }
  .hero-title { font-size: 42px; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ================================================================
// CONFIG
// ================================================================
const ANTHROPIC_VERSION = '2023-06-01';

// To persist the API key when deployed (GitHub Pages etc.), uncomment:
// state.apiKey = localStorage.getItem('mcatcrusher_key') || '';
// const saveKey = (k) => localStorage.setItem('mcatcrusher_key', k);

// ================================================================
// STATE
// ================================================================
const state = {
  screen: 'setup',
  provider: 'anthropic',          // 'anthropic' | 'openai'
  apiKey: '',
  model: 'claude-opus-4-7',
  topic: 'random',
  difficulty: 'standard',
  passage: null,
  currentQ: 0,
  answers: [],                    // committed selections
  solutionShown: [],              // boolean per question
  pendingAnswers: [],             // unsubmitted radio selections per question
  notes: '',
  notesOpen: false,
  highlightMode: false,
  strikeMode: false,
  paused: false,
  startedAt: null,
  elapsed: 0,
  pauseAccumulated: 0,
  pauseStartedAt: null,
  timerInterval: null,
  error: null,
};

// ================================================================
// PROMPT
// ================================================================
const SYSTEM_PROMPT = `You are an expert MCAT CARS (Critical Analysis and Reasoning Skills) item writer who produces passages and questions indistinguishable from official AAMC content. You write ONLY for the CARS section. You never produce science content (no biology, chemistry, physics, math, medicine, or clinical material). Your output is always rigorously formatted JSON.`;

// Real AAMC CARS passages have 5-7 questions, weighted toward 6.
function pickQuestionCount() {
  const dist = [5, 6, 6, 6, 7];
  return dist[Math.floor(Math.random() * dist.length)];
}

// LLMs strongly bias toward putting the correct answer in the same position
// (usually A) no matter what the prompt says. Fix by shuffling client-side.
function shuffleChoices(questions) {
  for (const q of questions) {
    const indices = [0, 1, 2, 3];
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    q.choices = indices.map(idx => q.choices[idx]);
    q.correct_index = indices.indexOf(q.correct_index);
  }
}

function buildUserPrompt(topic, difficulty) {
  const questionCount = state.questionCount || 6;
  const topicLine = topic === 'random'
    ? 'Choose any topic from humanities or social sciences. Vary your choices - do not always default to philosophy or to "the digital age".'
    : `The passage topic should be drawn from: ${topic}.`;

  const diffLine = difficulty === 'challenging'
    ? 'Calibrate to the HARDEST tier of official AAMC CARS: dense argumentation, very close distractors, two-step inferences, qualifying language throughout.'
    : 'Calibrate to a STANDARD official AAMC CARS passage: moderately dense, plausible distractors, clear-but-nuanced argument.';

  return `Generate ONE complete CARS passage with ${questionCount} questions. Return only valid JSON.

TOPIC
=====
${topicLine}

DIFFICULTY
==========
${diffLine}

PASSAGE REQUIREMENTS
====================
- Length: 500-600 words. Non-negotiable.
- Paragraphs: 4-6.
- Subject area: humanities OR social sciences ONLY. Acceptable: philosophy, ethics, literary criticism, art history, aesthetics, cultural studies, history, anthropology, sociology, political theory, religious studies, musicology, history-of-ideas, social aspects of economics.
- STRICTLY FORBIDDEN: biology, chemistry, physics, mathematics, medicine, clinical content, chemistry of anything, computer science, engineering. CARS NEVER tests these.
- Voice: third-person, single anonymous author with a clear analytical perspective. Not first-person. Not advocacy. Not narrative storytelling.
- Argument structure: the author makes ONE nuanced central claim, develops it with evidence/examples/interpretive moves, and typically acknowledges complication or counterview.
- Vocabulary: sophisticated and precise but never gratuitously obscure. Difficulty must come from REASONING, not rare words.
- Real thinkers (Foucault, Arendt, Sen, Barthes, Adorno, Dewey, Nussbaum, Said, Benjamin, Geertz) MAY be referenced; characterizations must be plausible. Do NOT fabricate publication titles, years, or page numbers.
- AVOID: direct address to the reader, rhetorical questions, chronological storytelling, polemic, encyclopedia-style summaries.

QUESTION REQUIREMENTS
=====================
Exactly ${questionCount} questions, distributed approximately:
- ~30% Foundations of Comprehension (main idea, author's tone/purpose, definition-in-context, function of a paragraph or phrase).
- ~30% Reasoning Within the Text (implication, inference, logical structure).
- ~40% Reasoning Beyond the Text (application to a new scenario; strengthen/weaken with new info).

Each question has exactly 4 answer choices, exactly one correct.

DISTRACTOR DESIGN
=================
All four choices must be plausible to a hurried test-taker. Each WRONG answer must fail for one specific identifiable reason:
- TOO EXTREME: absolute language when the passage is qualified.
- OUT OF SCOPE: introduces ideas not in the passage.
- HALF-RIGHT: one clause matches the passage, another does not.
- OPPOSITE: subtly inverts the author's position.
- TRUE-BUT-IRRELEVANT: passage-consistent but doesn't answer the stem.
The CORRECT answer is defensible from the PASSAGE ALONE.

ADDITIONAL METADATA (for display)
=================================
For each question include a one-line "skill" label matching its type and a one-line "discipline" label naming the humanities or social science field of the passage (e.g., "Philosophy", "Literary Criticism", "Political Theory").

OUTPUT FORMAT (strict JSON, no preamble, no markdown fences)
============================================================
{
  "topic": "one-line description of the passage subject",
  "discipline": "Humanities or social science field (e.g. Philosophy)",
  "passage": "the full passage with \\n\\n between paragraphs",
  "citation": "Adapted from a fictional source attribution in the style 'Adapted from J. Smith, Title (Year).'",
  "questions": [
    {
      "type": "Foundations of Comprehension" | "Reasoning Within the Text" | "Reasoning Beyond the Text",
      "skill": "short skill name",
      "discipline": "field name",
      "stem": "string",
      "choices": ["string","string","string","string"],
      "correct_index": 0,
      "explanation": "Why the correct answer is right AND a brief reason each of the three distractors fails (label them A/B/C/D)."
    }
  ]
}`;
}

// ================================================================
// API CALLS - Anthropic and OpenAI
// ================================================================
async function callAnthropic() {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': ANTHROPIC_VERSION,
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: state.model,
      max_tokens: 4096,
      system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content: buildUserPrompt(state.topic, state.difficulty) }],
    }),
  });
  if (!res.ok) {
    const errBody = await res.text();
    throw new Error(`Anthropic API ${res.status}: ${errBody.slice(0, 300)}`);
  }
  const data = await res.json();
  return (data.content || []).map(c => c.text || '').join('').trim();
}

async function callOpenAI() {
  // Responses API (/v1/responses) - the current endpoint for GPT-5.x and all
  // newer reasoning models. Chat Completions is legacy and doesn't get new features.
  const res = await fetch('https://api.openai.com/v1/responses', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.apiKey}`,
    },
    body: JSON.stringify({
      model: state.model,
      // System prompt lives in `instructions` now, not as a role inside input.
      instructions: SYSTEM_PROMPT,
      input: [
        { role: 'user', content: buildUserPrompt(state.topic, state.difficulty) },
      ],
      // Reasoning models burn output tokens on internal thinking too - give headroom.
      max_output_tokens: 8000,
      // 'medium' is the default. Drop to 'low' for speed, raise to 'high' for hardest passages.
      reasoning: { effort: 'medium' },
      // Replaces the old response_format. Forces valid JSON.
      text: { format: { type: 'json_object' } },
    }),
  });
  if (!res.ok) {
    const errBody = await res.text();
    throw new Error(`OpenAI API ${res.status}: ${errBody.slice(0, 300)}`);
  }
  const data = await res.json();
  if (data.status === 'incomplete') {
    throw new Error(`Response cut off (${data.incomplete_details?.reason || 'unknown'}). Increase max_output_tokens.`);
  }
  // Prefer the output_text convenience field; otherwise walk the output blocks.
  let text = data.output_text;
  if (!text && Array.isArray(data.output)) {
    text = data.output
      .filter(o => o.type === 'message')
      .flatMap(o => (o.content || []).filter(c => c.type === 'output_text').map(c => c.text))
      .join('');
  }
  return (text || '').trim();
}

async function generatePassage() {
  const raw = state.provider === 'openai' ? await callOpenAI() : await callAnthropic();
  const clean = raw.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '').trim();
  let parsed;
  try {
    parsed = JSON.parse(clean);
  } catch (e) {
    throw new Error('The model returned invalid JSON. Try again.');
  }
  if (!parsed.passage || !Array.isArray(parsed.questions) || parsed.questions.length === 0) {
    throw new Error('Malformed output (missing passage or questions). Try again.');
  }
  for (const q of parsed.questions) {
    if (!q.stem || !Array.isArray(q.choices) || q.choices.length !== 4 || typeof q.correct_index !== 'number') {
      throw new Error('One or more questions are malformed. Try again.');
    }
  }
  shuffleChoices(parsed.questions);
  return parsed;
}

// ================================================================
// TIMER
// ================================================================
function startTimer() {
  state.startedAt = Date.now();
  state.elapsed = 0;
  state.pauseAccumulated = 0;
  state.pauseStartedAt = null;
  state.paused = false;
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (!state.paused) {
      state.elapsed = Math.floor((Date.now() - state.startedAt - state.pauseAccumulated) / 1000);
      const el = document.getElementById('timer-display');
      if (el) el.textContent = formatTime(state.elapsed);
    }
  }, 1000);
}
function togglePause() {
  if (state.paused) {
    state.paused = false;
    if (state.pauseStartedAt) {
      state.pauseAccumulated += Date.now() - state.pauseStartedAt;
      state.pauseStartedAt = null;
    }
  } else {
    state.paused = true;
    state.pauseStartedAt = Date.now();
  }
  render();
}
function stopTimer() { if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; } }
function formatTime(s) {
  const hh = String(Math.floor(s / 3600)).padStart(2, '0');
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${hh}:${mm}:${ss}`;
}

// ================================================================
// PROVIDER / MODEL HELPERS
// ================================================================
const MODELS_BY_PROVIDER = {
  anthropic: [
    { value: 'claude-opus-4-7',    label: 'Claude Opus 4.7 - (Best Quality)' },
    { value: 'claude-sonnet-4-6',  label: 'Claude Sonnet 4.6 - (Cheaper)' },
  ],
  openai: [
    { value: 'gpt-5.5',            label: 'GPT-5.5' },
    { value: 'gpt-5',              label: 'GPT-5' },
    { value: 'gpt-4o',             label: 'GPT-4o' },
  ],
};
function defaultModelFor(provider) {
  return MODELS_BY_PROVIDER[provider][0].value;
}
function keyPrefixHintFor(provider) {
  return provider === 'openai' ? 'sk-...' : 'sk-ant-...';
}

// ================================================================
// RENDER
// ================================================================
function render() {
  const root = document.getElementById('app');
  if (state.screen === 'setup') return renderSetup(root);
  if (state.screen === 'loading') return renderLoading(root);
  if (state.screen === 'practice') return renderPractice(root);
  if (state.screen === 'review') return renderReview(root);
}

          </div>

            <div class="field-row">
              <div class="field">
                <label>Topic Area</label>
                <select id="topic">
                  <option value="random">Random</option>
                  <option value="philosophy and ethics">Philosophy and ethics</option>
                  <option value="literary criticism">Literary criticism</option>
                  <option value="art history and aesthetics">Art history and aesthetics</option>
                  <option value="history and political theory">History and political theory</option>
                  <option value="anthropology and sociology">Anthropology and sociology</option>
                  <option value="cultural studies">Cultural studies</option>
                  <option value="religious studies">Religious studies</option>
                </select>
              </div>
              <div class="field">
                <label>Difficulty</label>
                <select id="difficulty">
                  <option value="standard">Standard</option>
                  <option value="challenging">Challenging</option>
                </select>
              </div>
            </div>

            <button class="primary-btn" id="startBtn">Begin Practice</button>
            ${state.error ? `<div class="err">${escapeHtml(state.error)}</div>` : ''}
          </div>
        </div>

        <div class="settings-bar">
          <div class="settings-bar-header">
            <div class="settings-title">⚙ Settings</div>
          </div>
          <div class="settings-grid">
            <div class="field">
              <label>Provider</label>
              <select id="provider">
                <option value="anthropic" ${state.provider === 'anthropic' ? 'selected' : ''}>Anthropic (Claude)</option>
                <option value="openai" ${state.provider === 'openai' ? 'selected' : ''}>OpenAI (GPT)</option>
              </select>
            </div>
            <div class="field">
              <label>Model</label>
              <select id="model">${modelOpts}</select>
            </div>
            <div class="field">
              <label>API Key</label>
              <input type="password" id="apiKey" placeholder="${keyPrefixHintFor(state.provider)}" value="${escapeAttr(state.apiKey)}">
            </div>

      </div>
    </div>
  `;

  const providerSel = document.getElementById('provider');
  const modelSel = document.getElementById('model');
  const apiInput = document.getElementById('apiKey');
  const topicSel = document.getElementById('topic');
  const diffSel = document.getElementById('difficulty');

  topicSel.value = state.topic;
  diffSel.value = state.difficulty;

  providerSel.onchange = e => {
    state.provider = e.target.value;
    state.model = defaultModelFor(state.provider);
    render();
  };
  modelSel.onchange = e => { state.model = e.target.value; };
  apiInput.oninput = e => { state.apiKey = e.target.value; };
  topicSel.onchange = e => { state.topic = e.target.value; };
  diffSel.onchange = e => { state.difficulty = e.target.value; };

function renderLoading(root) {
  root.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Generating your passage - usually 20-50 seconds…</div>
    </div>
  `;
}

function renderPractice(root) {
  const p = state.passage;
  const q = p.questions[state.currentQ];
  const userAnswer = state.answers[state.currentQ];
  const pendingAnswer = state.pendingAnswers[state.currentQ];
  const solutionShown = state.solutionShown[state.currentQ];
  const total = p.questions.length;

  const passageHtml = p.passage.split(/\n\n+/).map(para => `<p>${escapeHtml(para)}</p>`).join('');

  const choicesHtml = q.choices.map((c, i) => {
    let cls = 'choice';
    if (solutionShown && i === q.correct_index) cls += ' correct-shown';
    const checked = (pendingAnswer === i || userAnswer === i) ? 'checked' : '';
    const disabled = solutionShown ? 'disabled' : '';
    return `
      <label class="${cls}">
        <input type="radio" name="answer" value="${i}" ${checked} ${disabled}>
        <span class="choice-text"><strong>${'ABCD'[i]}.</strong> ${escapeHtml(c)}</span>
      </label>
    `;
  }).join('');

  const explanationHtml = solutionShown ? `
    <div class="explanation">${escapeHtml(q.explanation)}</div>
  ` : '';

  let solutionIndicator = '';
  if (solutionShown) {
    const isCorrect = userAnswer === q.correct_index;
    solutionIndicator = `
      <div class="solution-indicator show">
        <span class="mark-icon ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '✓' : '✗'}</span>
        <span>Solution</span>
      </div>
    `;
  }

  const pauseLabel = state.paused ? 'Resume' : 'Pause';

  root.innerHTML = `
    <div class="topbar">
      <div>MCAT<span style="font-weight:400">Crusher</span> - CARS Practice</div>
      <div class="progress">${state.currentQ + 1} of ${total}</div>
    </div>

    <div class="subbar">
      <div class="subbar-left">
        <span class="tool ${state.highlightMode ? 'active' : ''}" id="highlightTool" title="Toggle highlight mode">
          <span class="swatch"></span><span class="label">▾ Highlight</span>
        </span>
        <span class="tool ${state.strikeMode ? 'active' : ''}" id="strikeTool" title="Toggle strikethrough mode">
          <span class="strike-icon"></span><span class="label">Strikethrough</span>
        </span>
        <span style="margin-left:auto; font-size:12px; color:#1A1A1A; opacity:0.7;">⏱ <span id="timer-display">${formatTime(state.elapsed)}</span></span>
      </div>
      <div class="subbar-center">
        <button class="subbar-btn" id="pauseBtn">${pauseLabel}</button>
        <button class="subbar-btn" id="solutionBtn" ${solutionShown ? 'disabled' : ''}>Solution</button>
      </div>
      <div class="subbar-right"></div>
    </div>

    <div class="practice">
      <div class="pane passage-pane" id="passagePane">
        <div class="passage-header">Passage 1 (Questions 1-${total})</div>
        <div class="passage-text" id="passageText">${passageHtml}</div>
        ${p.citation ? `<div class="passage-footer">${escapeHtml(p.citation)}</div>` : ''}
      </div>
      <div class="pane question-pane">
        <div class="question-header">Question ${state.currentQ + 1}</div>
        ${solutionIndicator}
        <div class="q-stem">${escapeHtml(q.stem)}</div>
        <div class="choices">${choicesHtml}</div>
        ${explanationHtml}
      </div>
    </div>

    <div class="bottombar">
      <div class="bottombar-left">
        <button class="nav-link" id="notesBtn"><u>N</u>otes</button>
        <button class="nav-link" id="scoreBtn"><u>S</u>core Report</button>
      </div>
      <div class="bottombar-right">
        <button class="nav-link" id="prevBtn" ${state.currentQ === 0 ? 'disabled' : ''}>← Previous</button>
        <button class="nav-link" id="nextBtn">${state.currentQ === total - 1 ? 'Finish →' : 'Next →'}</button>
      </div>
    </div>

    ${state.notesOpen ? renderNotesModal() : ''}
  `;

  // Wire up radio buttons
  document.querySelectorAll('input[name="answer"]').forEach(r => {
    r.onchange = e => {
      state.pendingAnswers[state.currentQ] = parseInt(e.target.value);
    };
  });

  // Wire up subbar
  document.getElementById('highlightTool').onclick = () => {
    state.highlightMode = !state.highlightMode;
    state.strikeMode = false;
    render();
  };
  document.getElementById('strikeTool').onclick = () => {
    state.strikeMode = !state.strikeMode;
    state.highlightMode = false;
    render();
  };
  document.getElementById('pauseBtn').onclick = togglePause;
  document.getElementById('solutionBtn').onclick = onShowSolution;

  // Highlight/strike: wrap selected text
  const passageText = document.getElementById('passageText');
  if (passageText) {
    passageText.onmouseup = () => {
      if (!state.highlightMode && !state.strikeMode) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;
      const range = sel.getRangeAt(0);
      // Only allow inside passageText
      if (!passageText.contains(range.commonAncestorContainer)) return;
      const wrapper = document.createElement(state.highlightMode ? 'mark' : 's');
      wrapper.className = state.highlightMode ? 'user-highlight' : 'user-strike';
      try {
        range.surroundContents(wrapper);
        sel.removeAllRanges();
      } catch (e) {
        // surroundContents fails on partial selections across multiple parents - ignore
      }
    };
  }

  // Bottom nav
  document.getElementById('notesBtn').onclick = () => { state.notesOpen = true; render(); };
  document.getElementById('scoreBtn').onclick = () => {
    stopTimer();
    state.screen = 'review';
    render();
  };
  document.getElementById('prevBtn').onclick = () => {
    if (state.currentQ > 0) {
      state.currentQ--;
      render();
    }
  };
  document.getElementById('nextBtn').onclick = () => {
    if (state.currentQ === total - 1) {
      stopTimer();
      state.screen = 'review';
      render();
    } else {
      state.currentQ++;
      render();
    }
  };

  // Notes modal handlers
  if (state.notesOpen) {
    document.getElementById('notesText').oninput = e => { state.notes = e.target.value; };
    document.getElementById('notesClose').onclick = () => { state.notesOpen = false; render(); };
  }
}

function renderNotesModal() {
  return `
    <div class="modal-backdrop">
      <div class="modal">
        <h3>Scratch Notes</h3>
        <textarea id="notesText" placeholder="Jot anything down - these notes persist for this session.">${escapeHtml(state.notes)}</textarea>
        <div class="modal-buttons">
          <button id="notesClose">Close</button>
        </div>
      </div>
    </div>
  `;
}

function renderReview(root) {
  const p = state.passage;
  const total = p.questions.length;
  let correctCount = 0;
  for (let i = 0; i < total; i++) {
    if (state.answers[i] === p.questions[i].correct_index) correctCount++;
  }
  const pct = Math.round((correctCount / total) * 100);

  const breakdownHtml = p.questions.map((q, i) => {
    const userAns = state.answers[i];
    const answered = userAns !== undefined;
    const isCorrect = userAns === q.correct_index;
    return `
      <div class="review-q">
        <div class="review-q-stem">${i+1}. ${escapeHtml(q.stem)}</div>
        <div class="review-q-meta">${escapeHtml(q.type || '')}${q.discipline ? ' · ' + escapeHtml(q.discipline) : ''}</div>
        <div class="review-q-answer">
          Your answer:
          <strong style="color: ${!answered ? 'var(--text-muted)' : (isCorrect ? 'var(--correct-green)' : 'var(--incorrect-red)')};">
            ${answered ? 'ABCD'[userAns] : '-'}
          </strong>
          ${answered ? (isCorrect ? '✓' : '✗') : '(unanswered)'}
          ${(!isCorrect || !answered) ? ` · Correct: <strong style="color: var(--correct-green);">${'ABCD'[q.correct_index]}</strong>` : ''}
        </div>
        <div class="review-q-explain">${escapeHtml(q.explanation)}</div>
      </div>
    `;
  }).join('');

  root.innerHTML = `
    <div class="topbar">
      <div>MCAT<span style="font-weight:400">Crusher</span> - Score Report</div>
      <div class="progress">Time: ${formatTime(state.elapsed)}</div>
    </div>
    <div class="review">
      <div class="review-card">
        <div class="score-banner">
          <div class="pct">${correctCount} / ${total}</div>
          <div class="label">${pct}% - ${escapeHtml(p.topic || '')}${p.discipline ? ' · ' + escapeHtml(p.discipline) : ''}</div>
        </div>
        ${breakdownHtml}
        <div class="review-actions">
          <button class="secondary-btn" id="homeBtn">Back to Home</button>
          <button class="primary-btn" id="anotherBtn">Generate New Passage</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('homeBtn').onclick = resetToHome;
  document.getElementById('anotherBtn').onclick = onStart;
}

// ================================================================
// RESET HELPERS
// ================================================================
function resetToHome() {
  stopTimer();
  state.screen = 'setup';
  state.passage = null;
  state.currentQ = 0;
  state.answers = [];
  state.pendingAnswers = [];
  state.solutionShown = [];
  state.elapsed = 0;
  state.error = null;
  state.notes = '';
  state.notesOpen = false;
  state.highlightMode = false;
  state.strikeMode = false;
  state.paused = false;
  render();
}

// ================================================================
// HANDLERS
// ================================================================
async function onStart() {
  if (!state.apiKey) {
    state.error = 'Please enter your API key.';
    render();
    return;
  }
  if (state.provider === 'anthropic' && !state.apiKey.startsWith('sk-ant-')) {
    state.error = 'Anthropic API keys start with "sk-ant-".';
    render();
    return;
  }
  if (state.provider === 'openai' && !state.apiKey.startsWith('sk-')) {
    state.error = 'OpenAI API keys start with "sk-".';
    render();
    return;
  }
  state.error = null;
  state.questionCount = pickQuestionCount();
  state.screen = 'loading';
  render();
  try {
    const passage = await generatePassage();
    state.passage = passage;
    state.currentQ = 0;
    state.answers = new Array(passage.questions.length);
    state.pendingAnswers = new Array(passage.questions.length);
    state.solutionShown = new Array(passage.questions.length).fill(false);
    state.notes = '';
    state.notesOpen = false;
    state.highlightMode = false;
    state.strikeMode = false;
    state.screen = 'practice';
    startTimer();
    render();
  } catch (err) {
    state.error = err.message || String(err);
    state.screen = 'setup';
    render();
  }
}

function onShowSolution() {
  const i = state.currentQ;
  // Commit the pending answer (or leave undefined if nothing picked)
  if (state.pendingAnswers[i] !== undefined && state.answers[i] === undefined) {
    state.answers[i] = state.pendingAnswers[i];
  }
  state.solutionShown[i] = true;
  render();
}

// ================================================================
// HELPERS
// ================================================================
function escapeHtml(s) {
  if (s == null) return '';
  if (typeof s !== 'string') s = String(s);
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

// ================================================================
// INIT
// ================================================================
render();
</script>
